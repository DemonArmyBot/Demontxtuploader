services:
  - type: web
    name: txt_extract 
    plan: free
    env: docker
    dockerfilePath: Dockerfile
    repo: https://github.com/DemonArmyBot/Demontxtuploader
    branch: main
    autoDeploy: false
    envVars:
      - key: BOT_TOKEN
        sync: false
      - key: API_ID
        sync: false
      - key: API_HASH
        sync: false
      #- key: WEBHOOK
        #sync: false
      - key: PORT
        value: 8181  # Default port value, update if needed
